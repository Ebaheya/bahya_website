# Reverse proxy for the Bahya API: api.refk.tech -> api:3000
#
# TLS certificates are provisioned by Certbot (see deploy/init-letsencrypt.sh).
# Until the first real certificate is issued, the dummy cert created by that
# script keeps nginx from failing to start on the https block.

# ---- HTTP: serve ACME challenges, redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name api.refk.tech;

    # Let's Encrypt webroot challenge — must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: terminate TLS and proxy to the API container ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.refk.tech;

    ssl_certificate     /etc/letsencrypt/live/api.refk.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.refk.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Match the API's express.json({ limit: '1mb' }) body cap.
    client_max_body_size 1m;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
